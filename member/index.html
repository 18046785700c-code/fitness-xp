<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fitness XP 会员端</title>
<!-- 手机添加到主屏幕后，状态栏跟着品牌色走（内联，不引入任何外部资源） -->
<meta name="theme-color" content="#F4F6F8">
<!-- 内联图标：避免浏览器自动请求 /favicon.ico 产生 404，同时供手机端「添加到主屏幕」使用 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236D5CE8'/%3E%3Ctext x='16' y='22' font-size='14' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'%3EFX%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236D5CE8'/%3E%3Ctext x='16' y='22' font-size='14' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'%3EFX%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/member.css">
</head>
<body>

<header class="m-top">
  <div class="m-top-in">
    <div class="m-brand">
      <span class="m-logo">FX</span>
      <div>
        <div class="m-title">Fitness XP 会员端</div>
        <div class="m-sub" id="mStoreState">初始化中…</div>
      </div>
    </div>
    <div class="m-top-right" id="mTopRight"></div>
  </div>
</header>

<main class="m-wrap">

  <!-- 原型安全边界：注册 / 核验 / 档案未完善时显示一行；档案完善后由 member.js 加 hidden 隐藏，
       完整说明在「我的 → 关于数据」。下面的关键词被 U3/U4/V3 断言依赖，改文案前先看测试。 -->
  <div class="m-banner" id="mBanner" title="数据只保存在这台设备的浏览器里，不会上传服务器；本页没有登录与权限校验，也不会自动同步到其他设备或教练端。完整说明见「我的 → 关于数据」。">
    <b>说明</b>　本页没有登录与权限校验；数据只存本机、不会自动同步。
  </div>

  <div id="mApp"><div class="m-loading">载入中…</div></div>

</main>

<nav class="m-tabbar" id="mTabbar" hidden></nav>

<!-- 全局轻提示：保存失败、非法输入等必须让用户看见，不能静默 -->
<div class="m-toast" id="mToast" hidden></div>

<!-- 既有通用层（只读复用，不修改） -->
<!-- 会员端：契约层 → 存储层 → 种子数据 → 身份层 → 领域层（目标/计划/会话/XP）→ 应用层 -->
<!-- 阶段7：探索地图 + 灵感卡（先挂进来，页面在下一小步接） -->
<!-- 阶段7：高级计划调整 / 为什么慢 / 成长时间线。必须排在 explore 之后：
     浏览器分支的人口分组函数是从 FXP.memberExplore 取的，要跟它保持同一口径。 -->
<!-- AI 教练的「动作能力配置」：会员端动作库只用它来展示 A/B/C 监测等级与机位说明。
     等级的唯一真值在这份配置里（getMonitor），页面不得另写一套文案。
     该模块是纯数据 + 纯函数，不含摄像头/网络代码，因此会员端引入它是安全的；
     会员端与 AI 教练的数据仍然各存各的键，互不相通。 -->

<script src="js/app.bundle.js"></script>
</body>
</html>
