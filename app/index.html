<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3563E9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fitness XP">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Fitness XP V1 — 会员活跃度管理</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Fitness XP <span class="ver">V1</span></div>
  <div id="dataStatus" class="status">未导入数据</div>
  <div class="actions">
    <button id="btnImport" type="button">导入 CSV</button>
    <button id="btnExport" type="button">导出 CSV</button>
    <button id="btnRunRules" type="button">执行规则</button>
    <button id="btnClear" type="button" class="danger-ghost">清空数据</button>
    <input type="file" id="fileInput" multiple accept=".csv,text/csv" hidden>
  </div>
</header>

<nav class="nav" id="nav">
  <a href="#priority" data-view="priority"><span class="nav-ico">🎯</span><span>今日优先</span></a>
  <a href="#overview" data-view="overview"><span class="nav-ico">📊</span><span>经营概览</span></a>
  <a href="#members" data-view="members"><span class="nav-ico">👥</span><span>会员列表</span></a>
  <a href="#tasks" data-view="tasks"><span class="nav-ico">✅</span><span>教练待办</span></a>
  <a href="#records" data-view="records"><span class="nav-ico">📝</span><span>训练与跟进</span></a>
  <a href="#xp" data-view="xp"><span class="nav-ico">⭐</span><span>XP 流水</span></a>
  <div class="nav-gap"></div>
  <div class="nav-foot">数据存于本机浏览器<br>跨设备同步走 CSV</div>
</nav>

<main id="view"></main>

<footer class="foot">
  数据已自动保存在本机浏览器（刷新不丢），但仅限本机本浏览器；跨设备同步请导出 CSV 回写协作表格 · 所有风险判断基于训练记录日期推导，可在规则摘要中追溯
</footer>

<div id="modalWrap" class="modal-wrap" hidden>
  <div class="modal">
    <div class="modal-head"><span id="modalTitle"></span><button id="modalClose" type="button">×</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>
<div id="toastWrap"></div>

<script src="../src/js/fxp-csv.js"></script>
<script src="../src/js/fxp-validate.js"></script>
<script src="../src/js/fxp-engine.js"></script>
<script src="../src/js/fxp-xp.js"></script>
<script src="../src/js/fxp-adapt.js"></script>
<script src="../src/js/fxp-persist.js"></script>
<script src="../src/js/fxp-risk.js"></script>
<script src="../src/js/fxp-task.js"></script>
<script src="js/app.js"></script>
<script src="js/pilot-data.js"></script>
</body>
</html>
