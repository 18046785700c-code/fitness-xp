<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitness XP · 训练记录与计划</title>
<!-- 内联图标：不声明的话浏览器会自动请求 /favicon.ico 并报 404 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236D5CE8'/%3E%3Ctext x='16' y='22' font-size='14' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'%3EFX%3C/text%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fitness XP">
<meta name="theme-color" content="#F4F6F8">
<style>
  :root{
    --bg:#F4F6F8; --ink:#29263D; --ink2:#605E75;
    --pri:#6D5CE8; --pri-deep:#5144B5; --pri-l:#F0EDFF; --pri-ink:#4C3FB2;
    --line:#E9E8F0; --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body { margin:0; padding:24px 16px 40px;
         font:15px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
         background:var(--bg); color:var(--ink); }
  .box { max-width:520px; margin:0 auto; }
  .hero{ background:linear-gradient(135deg,#6D5CE8 0%,#9B7BFF 60%,#6FB0D8 100%);
         border-radius:18px; padding:24px 20px; color:#fff; margin-bottom:14px; }
  .hero h1{ font-size:24px; margin:0 0 4px; font-weight:700; letter-spacing:-.2px; }
  .hero p{ margin:0; font-size:14px; opacity:.94; }
  .btn{ display:block; text-align:center; text-decoration:none; border-radius:14px;
        padding:14px 18px; font-size:16px; font-weight:600; margin-bottom:10px;
        min-height:52px; line-height:1.3; }
  .btn-p{ background:var(--pri); color:#fff; }
  .btn-p:active{ background:var(--pri-deep); }
  .btn-s{ background:var(--pri-l); color:var(--pri-ink); border:1px solid #DCD5F8; }
  ol.steps{ margin:16px 0 0; padding:0; list-style:none; counter-reset:s; }
  ol.steps li{ counter-increment:s; position:relative; background:var(--card);
    border:1px solid var(--line); border-radius:12px; padding:12px 14px 12px 46px;
    margin-bottom:8px; font-size:14px; }
  ol.steps li::before{ content:counter(s); position:absolute; left:14px; top:12px;
    width:22px; height:22px; border-radius:50%; background:var(--pri-l); color:var(--pri-ink);
    font-size:12.5px; font-weight:700; text-align:center; line-height:22px; }
  ol.steps li b{ display:block; margin-bottom:2px; }
  ol.steps li span{ color:var(--ink2); font-size:12.5px; }
  .note{ background:var(--card); border:1px solid var(--line); border-radius:12px;
         padding:10px 14px; font-size:12.5px; color:var(--ink2); margin-top:12px; }
  .mini{ margin-top:22px; font-size:12.5px; color:var(--ink2); text-align:center; }
  .mini a{ color:var(--pri-ink); margin:0 8px; }
  .foot{ margin-top:10px; font-size:11.5px; color:#9A94AD; text-align:center; }
</style>
</head>
<body>
<div class="box">

  <div class="hero">
    <h1>Fitness XP</h1>
    <p>训练记录与计划 —— 记下每一组，看得见进步。</p>
  </div>

  <a class="btn btn-p" href="./member/index.html#register">开始使用</a>
  <a class="btn btn-s" href="./member/index.html#home">已有会员号，继续练</a>

  <ol class="steps">
    <li><b>创建账号</b><span>约 30 秒：姓名、手机号，注册完自动生成你的会员号。</span></li>
    <li><b>填写训练档案</b><span>每周能练几天、每次多久、有哪些器械 —— 填得越全，计划越准。</span></li>
    <li><b>生成计划，开始第一练</b><span>一键生成一周计划到点就练；等不及也可以直接自由训练。</span></li>
  </ol>

  <div class="note">
    数据只保存在本机浏览器里，不上传服务器；换设备或换浏览器需要用页面内的「导出 / 导入」迁移。
  </div>

  <div class="mini">
    <a href="./ai-coach/index.html">AI 姿势辅助</a>
    <a href="./standalone/fitness-xp-member.html" download>离线单文件版</a>
  </div>
  <div class="foot">公司或校园网络若提示「已被管理员阻止」，用离线单文件版即可 · 手机竖屏体验最佳</div>

</div>
</body>
</html>
